<style>
:root{--g:#1f6f4a;--g2:#175a3b;--gl:#e3f1e8;--ink:#17261d;--ink2:#51655a;--mut:#8a9a90;--line:#dbe4de;--bg:#f3f6f1;--card:#fff;--acc:#1d6fd8;--warn:#c2410c;--bad:#b3261e;--r:14px;--sh:0 4px 18px rgba(20,50,35,.14);--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.ic{display:block;flex:none}
/* início */
.homebar{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 16px;background:linear-gradient(135deg,var(--g),#2c8f5f);color:#fff}
.brand{display:flex;gap:12px;align-items:center}.brand h1{margin:0;font-size:21px}.brand p{margin:2px 0 0;opacity:.85;font-size:13px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.homebody{flex:1;overflow:auto;padding:16px 16px calc(96px + var(--safe))}
.empty{text-align:center;padding:36px 20px;color:var(--ink2)}.empty h2{color:var(--ink);margin:12px 0 6px}
.plist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pcard .th{display:block;width:100%;aspect-ratio:16/10;background:#e9efe6 center/cover no-repeat;border:0;padding:0}
.pcard .pb{padding:10px 12px 12px}.pcard h3{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{color:var(--ink2);display:block}.pcard .pa{display:flex;gap:8px;margin-top:10px}
.pcard .pa button{flex:1;display:flex;gap:6px;justify-content:center;align-items:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px}
.pcard .pa .open{background:var(--g);color:#fff;border-color:var(--g)}
.newfab{position:fixed;right:18px;bottom:calc(20px + var(--safe));display:flex;gap:8px;align-items:center;background:var(--g);color:#fff;border:0;border-radius:30px;padding:14px 20px;font-weight:600;box-shadow:var(--sh)}
.homefoot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.linkbtn{background:none;border:0;color:var(--g);text-decoration:underline;padding:6px}
/* editor */
.topbar{display:flex;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top,0px)) 6px 6px;background:var(--g);color:#fff}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:inherit}
.ib:active{background:rgba(255,255,255,.18)}
.title{flex:1;min-width:0;text-align:left;border:0;background:none;color:#fff;font-weight:600;font-size:16px;padding:4px 6px}
.title span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title small{display:block;font-weight:400;font-size:11px;opacity:.8}
.stage{position:relative;flex:1;min-height:0;background:#fff;overflow:hidden}
#cv{position:absolute;inset:0;touch-action:none;display:block}
.pill{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;background:rgba(255,255,255,.95);border-radius:20px;box-shadow:var(--sh);padding:3px;z-index:3}
.pill button{border:0;background:none;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;color:var(--ink2)}
.pill button.on{background:var(--g);color:#fff}
.hint{position:absolute;top:56px;left:50%;transform:translateX(-50%);max-width:calc(100% - 100px);background:rgba(23,38,29,.88);color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;text-align:center;z-index:3;pointer-events:none}
.fabs{position:absolute;right:10px;top:60px;display:flex;flex-direction:column;gap:8px;z-index:3}
.fab{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink)}
.fab[aria-pressed=true]{background:var(--g);color:#fff}
.ctxbar,.drawbar{position:absolute;left:8px;right:8px;bottom:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:3}
.ctxbar button,.drawbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:8px 10px;border:0;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:11px;font-weight:600}
.drawbar button{flex-direction:row;gap:6px;font-size:13px;padding:11px 14px}
.ctxbar button.danger{color:var(--bad)}.drawbar .ok{background:var(--g);color:#fff}
.tools{display:flex;gap:2px;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;background:none;border-radius:12px;color:var(--ink2);font-size:11px;font-weight:600}
.tools button.on{background:var(--gl);color:var(--g)}
.tools .sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
/* folhas */
#sheetwrap{position:fixed;inset:0;z-index:20}
.sbg{position:absolute;inset:0;background:rgba(10,25,15,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);max-width:760px;margin:0 auto}
.sheet.mid{max-height:62%}
.sh-head{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}.sh-head h2{flex:1;margin:0;font-size:18px}
.sh-head button{width:38px;height:38px;border-radius:50%;border:0;background:#eef2ee;display:grid;place-items:center}
.sh-body{overflow:auto;padding:6px 16px calc(20px + var(--safe));-webkit-overflow-scrolling:touch}
.sec{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.fld{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eef2ee}
.fld>span{flex:1;color:var(--ink2);font-size:14px}.fld em{color:var(--mut);font-style:normal;width:26px;font-size:13px}
.fld input,.fld select,.inp{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.fld input[type=text],.fld input[inputmode],.fld select{width:46%;text-align:right}
.fld input[type=range]{width:46%;padding:0}.fld input[type=checkbox]{width:22px;height:22px;accent-color:var(--g)}
.inp{width:100%;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}.btn.dng{color:var(--bad);border-color:#efc8c4}
.btn.sm{padding:8px 12px;font-size:13px}.btn.blk{width:100%}
.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}
.note{font-size:13px;color:var(--ink2);background:#f3f6f1;border-radius:10px;padding:10px 12px;margin:10px 0}
.note.warn{background:#fff4e5;color:#7a3e00}
.info{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef2ee;font-size:14px}.info b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.lib-item{display:flex;gap:6px;align-items:stretch;margin:6px 0}
.li-main{flex:1;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px}
.li-main img{width:52px;height:52px;border-radius:9px;flex:none;background:#e6ecdc}
.li-main b{display:block;font-size:14.5px}.li-main small{color:var(--ink2)}
.li-side{display:flex;flex-direction:column;gap:6px}.li-side button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 10px;font-size:12px;font-weight:600;color:var(--g)}
.bud-item{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.bud-item .r1{display:flex;gap:8px;align-items:center}.bud-item .r1 .inp{flex:1}

const M_geom = (function(){
/* geom.js: geometria em METROS (y para baixo), unidades e utilidades. Zoom nunca altera estes valores. */

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

}

function objPoly(o) {

/* quadriláteros de uma linha com espessura (para área de caminhos) */
function lineQuads(o) {

      return o.lot ? !(dx <= o.w / 2 - tol && dy <= o.h / 2 - tol) : true;

    case 'circle': return dist(p, { x: o.cx, y: o.cy }) <= o.r + tol;

    case 'line': return o.pts.some((a, i) => i < o.pts.length - 1 && segDist(p, a, o.pts[i + 1]).d <= Math.max((o.width || 0) / 2, tol));

      if (!v) { ED.cancelDraft(); return; } const real = parseLen(v.d); if (!(real > 0)) { toast('Medida inválida.'); ED.cancelDraft(); return; }
      if (ED.applyCalibration(E.calib.pts[0], E.calib.pts[1], real)) { toast('Escala calibrada. Agora as medidas seguem a foto.'); ED.setTool('select'); ED.fit(); }
    },
  });
  document.addEventListener('click', (e) => {
    const tl = e.target.closest('[data-tool]');
    if (tl) { const t = tl.dataset.tool; if (t[0] === '@') { openSheet(t.slice(1)); return; } ED.setTool(t === 'poly' ? 'poly' : t); return; }
    const b = e.target.closest('[data-act]'); if (b) { e.preventDefault(); act(b.dataset.act, b); }
  });
  document.addEventListener('change', onChange); document.addEventListener('input', onInput);
  document.addEventListener('visibilitychange', () => { if (document.hidden && U.project) saveNow(); }); window.addEventListener('pagehide', () => { if (U.project) saveNow(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && U.sheet) closeSheet(); });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* ok */ }
  showHome().then(() => { let seen = false; try { seen = localStorage.getItem('paisagismo:help'); localStorage.setItem('paisagismo:help', '1'); } catch (e) { /* ok */ } if (!seen) openSheet('help'); });
  window.__app = { U, ED, act };
}
boot();

return {changed, toast};
})();
